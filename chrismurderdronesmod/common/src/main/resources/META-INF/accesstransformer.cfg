# AbstractContainerScreen.leftPos/topPos are protected in vanilla. NeoForge adds
# its own public getGuiLeft()/getGuiTop() wrapper methods via patch, which isn't
# available when common compiles standalone against bare NeoForm — so this widens
# the underlying fields directly instead, matching chrismurderdronesmod.accesswidener
# (fabric side needs the same widening via its own mechanism).
public net.minecraft.client.gui.screens.inventory.AbstractContainerScreen leftPos # leftPos
public net.minecraft.client.gui.screens.inventory.AbstractContainerScreen topPos # topPos
